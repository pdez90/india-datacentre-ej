# Runs the data-contract and Shiny smoke test on every push / pull request that
# touches the app or its data, so an inconsistent data/ build cannot land on main
# unnoticed. Mirrors:  Rscript tests/check_app_data.R
name: check-app-data

on:
  push:
    branches: [main]
    paths: ["app.R", "data/**", "tests/**", ".github/workflows/check-app-data.yml"]
  pull_request:
    paths: ["app.R", "data/**", "tests/**", ".github/workflows/check-app-data.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::jsonlite
            any::shiny
            any::bslib
            any::DT
            any::dplyr
            any::leaflet
      - name: Data contract + server smoke test
        run: Rscript tests/check_app_data.R
